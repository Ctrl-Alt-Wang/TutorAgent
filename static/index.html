<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能教材讲解系统</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <!-- 头部 -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">📚</div>
            <span>智能教材讲解系统</span>
        </div>
        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator">等待上传</div>
        </div>
    </header>

    <!-- 主容器 -->
    <main class="main-container">
        <!-- 左侧 - 上传区域 -->
        <section class="card upload-section">
            <div class="card-header">
                <div class="card-title">
                    <div class="card-title-icon">📄</div>
                    教材内容
                </div>
            </div>
            <div class="card-body">
                <!-- 上传区 -->
                <div class="upload-zone" id="uploadZone">
                    <div class="upload-icon">📷</div>
                    <div class="upload-text">点击或拖拽上传教材图片</div>
                    <div class="upload-hint">支持 JPG、PNG 格式</div>
                </div>
                <input type="file" id="fileInput" accept="image/*" hidden>
                
                <!-- 预览区 -->
                <div class="preview-container" id="previewContainer" style="display: none;">
                    <img src="" alt="预览" class="preview-image" id="previewImage">
                    <button class="btn btn-secondary" id="reuploadBtn" style="margin-top: 12px;">
                        <span>🔄</span> 重新上传
                    </button>
                </div>

                <!-- 文本输入 -->
                <div class="text-input-section" style="margin-top: 16px;">
                    <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500;">
                        或输入文本内容：
                    </label>
                    <textarea 
                        id="textInput" 
                        class="text-input" 
                        placeholder="输入教材内容或题目..."
                        rows="4"
                        style="width: 100%; padding: 12px; border: 1.5px solid #e5e7eb; border-radius: 8px; font-size: 14px; resize: vertical;"
                    ></textarea>
                </div>

                <!-- 开始讲解按钮 -->
                <button class="btn btn-primary btn-large" id="startLectureBtn" style="width: 100%; margin-top: 16px;">
                    <span>🎯</span> 开始讲解
                </button>
            </div>
        </section>

        <!-- 中间 - 讲解区域 -->
        <section class="card lecture-section">
            <!-- 欢迎屏幕 -->
            <div id="welcomeScreen">
                <div class="card-header">
                    <div class="card-title">
                        <div class="card-title-icon">🎓</div>
                        AI 智能讲解
                    </div>
                </div>
                
                <div class="lecture-content" style="display: flex; align-items: center; justify-content: center; height: 100%;">
                    <div class="qa-empty">
                        <div class="qa-empty-icon">🎯</div>
                        <div>上传教材图片或输入文本开始智能讲解</div>
                        <div style="font-size: 13px; margin-top: 8px;">
                            点击<span class="highlight" style="cursor: default; padding: 2px 6px; background: rgba(99, 102, 241, 0.1); border-radius: 4px; color: var(--primary);">高亮内容</span>可以暂停提问
                        </div>
                    </div>
                </div>
            </div>

            <!-- 讲解屏幕 -->
            <div id="lectureScreen" style="display: none; height: 100%; flex-direction: column;">
                <div class="card-header" style="flex-shrink: 0;">
                    <div class="card-title">
                        <div class="card-title-icon">🎓</div>
                        AI 智能讲解
                    </div>
                    <div class="progress-info">
                        <span id="progressText">准备中...</span>
                    </div>
                </div>
                
                <!-- 进度条 -->
                <div class="voice-progress" style="flex-shrink: 0;">
                    <div class="voice-progress-bar" id="progressBar" style="width: 0%;"></div>
                </div>

                <!-- 讲解内容 -->
                <div class="lecture-content" id="contentCard" style="flex: 1; overflow-y: auto; padding: 20px;">
                    <!-- 动态生成的讲解段落 -->
                </div>

                <!-- 语音控制条 -->
                <div class="voice-control" style="flex-shrink: 0;">
                    <div class="voice-buttons">
                        <button class="voice-btn secondary" id="prevBtn" title="上一段">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                            </svg>
                        </button>
                        <button class="voice-btn main" id="playPauseBtn" title="播放/暂停">
                            <div class="icon">
                                <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </div>
                        </button>
                        <button class="voice-btn secondary" id="nextBtn" title="下一段">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                            </svg>
                        </button>
                        <button class="voice-btn secondary" id="stopBtn" title="停止">
                            <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                                <rect x="6" y="6" width="12" height="12" rx="1"/>
                            </svg>
                        </button>
                        <div class="speed-control" style="margin-left: auto;">
                            <input type="range" id="speedControl" min="0.5" max="2" step="0.1" value="1" style="width: 80px;">
                            <span id="speedValue" style="margin-left: 8px; font-size: 13px;">1.0x</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 右侧 - 问答区域 -->
        <section class="card qa-section">
            <div class="card-header">
                <div class="card-title">
                    <div class="card-title-icon">💬</div>
                    互动问答
                </div>
            </div>
            
            <!-- 问答列表 -->
            <div class="qa-list" id="qaContainer" style="flex: 1; overflow-y: auto; padding: 16px;">
                <div class="qa-empty">
                    <div class="qa-empty-icon">💡</div>
                    <div>有疑问？随时提问！</div>
                    <div style="font-size: 13px; margin-top: 8px;">讲解将暂停等待您的问题</div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="qa-input-area">
                <div class="qa-input-wrapper">
                    <input 
                        type="text" 
                        class="qa-input" 
                        id="questionInput" 
                        placeholder="输入您的问题...按Enter发送"
                    >
                    <button class="qa-submit" id="sendQuestionBtn" title="发送">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </section>
    </main>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="loading-spinner"></div>
        <p id="loadingText">正在分析内容...</p>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
